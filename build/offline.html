<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>当前网络无法连接至服务器</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; display: grid; place-items: center; background: linear-gradient(145deg, #eef5ff 0%, #f8fafc 48%, #eff6ff 100%); color: #172033; }
    main { width: min(100% - 32px, 620px); padding: clamp(28px, 6vw, 52px); border: 1px solid #dbeafe; border-radius: 24px; background: rgba(255, 255, 255, .92); box-shadow: 0 24px 60px rgba(30, 64, 175, .12); }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px; border-radius: 999px; background: #eff6ff; color: #2563eb; font-size: 13px; font-weight: 700; }
    .badge::before { width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; content: ""; }
    h1 { margin: 20px 0 14px; font-size: clamp(26px, 5vw, 38px); line-height: 1.25; letter-spacing: -.03em; }
    p { margin: 0; color: #526079; font-size: 16px; line-height: 1.8; }
    h2 { margin: 36px 0 16px; font-size: 16px; }
    ol { display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; counter-reset: advice; }
    li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; color: #34425c; line-height: 1.5; }
    li::before { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 9px; background: #eff6ff; color: #2563eb; font-size: 12px; font-weight: 800; counter-increment: advice; content: "0" counter(advice); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 36px; }
    a, button { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 11px; padding: 10px 16px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    button { background: #2563eb; color: #fff; box-shadow: 0 8px 18px rgba(37, 99, 235, .22); }
    a { border: 1px solid #bfdbfe; background: #fff; color: #1d4ed8; }
    button:hover { background: #1d4ed8; }
    a:hover { background: #eff6ff; }
    small { display: block; margin-top: 18px; color: #7a879c; font-size: 12px; line-height: 1.6; }
    .support-email { min-height: auto; display: inline; border: 0; border-radius: 0; padding: 0; background: transparent; color: #1d4ed8; font: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
    .support-email:hover { background: transparent; color: #1e40af; }
    @media (max-width: 460px) { .actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <span class="badge">离线兜底页面</span>
    <h1>当前网络无法连接至服务器</h1>
    <p>本页面来自您浏览器缓存。请检查您设备网络是否正常，或切换非中国大陆网络访问；如一直显示此页面，请联系支持：<a class="support-email" href="mailto:admin@nice188.com">admin@nice188.com</a>。</p>
    <h2>建议优先检查</h2>
    <ol>
      <li>确认设备网络连接正常</li>
      <li>切换非中国大陆网络访问</li>
      <li>仍无法访问时联系支持</li>
    </ol>
    <div class="actions">
      <button type="button" onclick="window.location.reload()">重新连接</button>
      <a href="mailto:admin@nice188.com">联系客服（邮箱：admin@nice188.com）</a>
    </div>
    <small>网络恢复后，点击“重新连接”即可返回网站。</small>
  </main>
</body>
</html>
